name: CI

# The Unity project needs a licensed editor and a headset, so it is
# verified locally (see docs/00-build/TESTING.md). CI covers everything
# that runs on a plain Linux runner.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guide-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/guide-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the token-minting proxy
        run: npm test

  build-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pillow
      - name: Test the art and APK verification scripts
        run: python -m pytest -q scripts/test_art_tools.py scripts/test_verify_cargo.py
